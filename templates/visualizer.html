<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompliAI Pipeline Result Viewer</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-gray-900 text-gray-100 font-sans">
    <header class="p-4 border-b border-gray-700">
        <h1 class="text-3xl font-bold text-center">CompliAI Pipeline Result</h1>
    </header>
    <main class="p-4 max-w-4xl mx-auto">
        {% if has_error %}
            <section class="bg-red-900 p-4 rounded mb-4">
                <h2 class="text-xl font-semibold mb-2">Error</h2>
                <pre class="whitespace-pre-wrap">{{ json_data }}</pre>
            </section>
        {% else %}
            <section class="bg-gray-800 p-4 rounded mb-4 overflow-x-auto">
                <h2 class="text-xl font-semibold mb-2">Result JSON</h2>
                <pre class="whitespace-pre-wrap">{{ json_data }}</pre>
            </section>
        {% endif %}
        <section class="bg-gray-800 p-4 rounded overflow-x-auto">
            <h2 class="text-xl font-semibold mb-2">Server Log (logger.txt)</h2>
            <pre class="whitespace-pre-wrap">{{ logs }}</pre>
        </section>
    </main>
    <footer class="p-4 text-center border-t border-gray-700 mt-8">
        <p>Generated by <strong>visualizer_server.py</strong></p>
    </footer>
</body>
</html>
