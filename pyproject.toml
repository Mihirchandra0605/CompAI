[project]
name = "compliai"
version = "0.1.0"
description = "Autonomous Compliance Engineering Digital Twin for Telecom Systems"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "langchain==0.3.1",
    "langchain-openai==0.2.1",
    "langgraph==0.2.28",
    "networkx==3.3",
    "structlog==24.4.0",
    "aiosqlite==0.20.0",
    "jinja2==3.1.4",
    "lxml==5.3.0",
    "pyyaml==6.0.2",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "numpy==1.26.4",
    "chromadb>=0.5.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pymupdf>=1.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.8",
    "mypy==1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "backend",
    "backend_new",
    "ccl",
    "contracts",
    "domain",
    "events",
    "explainability",
    "graph",
    "hitl",
    "infrastructure",
    "observability",
    "orchestration",
    "persistence",
    "probes",
    "reports",
    "schemas",
    "tools",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
